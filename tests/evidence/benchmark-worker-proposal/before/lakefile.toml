name = "lean1090"
version = "0.1.0"
defaultTargets = ["Spec", "Capstones", "Proofs"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Spec"

[[lean_lib]]
name = "Capstones"

[[lean_lib]]
name = "Model"

[[lean_lib]]
name = "Impl"

[[lean_lib]]
name = "Proofs"

[[lean_lib]]
name = "Bench"

[[lean_exe]]
name = "bds50Pilot"
root = "Bench.BDS50"
moreLeancArgs = ["-O3"]

[[lean_exe]]
name = "cprDifferential"
root = "scripts.FuzzCPR"
moreLeancArgs = ["-O3"]

[[lean_lib]]
name = "Tests"

[[lean_exe]]
name = "numericTests"
root = "Tests.Numeric"
moreLeancArgs = ["-O3", "-ffp-contract=off"]

[[lean_lib]]
name = "CLI"

[[lean_exe]]
name = "lean1090"
root = "CLI.Main"
moreLeancArgs = ["-O3", "-ffp-contract=off"]

[[lean_exe]]
name = "messageGenerator"
root = "Tests.MessageGenerator"
moreLeancArgs = ["-O3", "-ffp-contract=off"]

[[lean_exe]]
name = "commbDifferential"
root = "Tests.CommBDifferential"
moreLeancArgs = ["-O3", "-ffp-contract=off"]

[[lean_exe]]
name = "dteDifferential"
root = "Tests.DTEDifferential"
moreLeancArgs = ["-O3", "-ffp-contract=off"]

[[lean_exe]]
name = "commbGenerator"
root = "scripts.FuzzCommB"
moreLeancArgs = ["-O3", "-ffp-contract=off"]
